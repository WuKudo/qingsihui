<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品审核后台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{max-width:860px;margin:20px auto;padding:0 12px;background:#f5f7fb;color:#21304a}

/* 密码锁遮罩 */
#lock{position:fixed;inset:0;background:#eef2f9;display:flex;align-items:center;justify-content:center;z-index:99}
#lock .box{background:#fff;padding:28px 26px;border-radius:14px;box-shadow:0 8px 30px rgba(31,79,168,.15);width:320px;text-align:center}
#lock h3{margin:0 0 6px;font-size:18px}
#lock p{margin:0 0 16px;font-size:13px;color:#6e7d94}
#lock input{width:100%;padding:10px 12px;border:1px solid #cfd8e6;border-radius:8px;font-size:14px;outline:none}
#lock input:focus{border-color:#2e86de}
#lock button{margin-top:12px;width:100%;padding:10px;border:none;border-radius:8px;background:#1f4fa8;color:#fff;font-size:14px;cursor:pointer}
#lock .err{color:#ef4444;font-size:13px;margin-top:10px;min-height:18px}

.item{border:1px solid #e2e8f2;padding:16px;border-radius:12px;margin-bottom:12px;background:#fff}
.item h3{margin:0 0 6px;font-size:16px}
.meta{font-size:13px;color:#55667f;margin-bottom:6px}
.desc{font-size:14px;color:#35435c;margin:6px 0}
.item img{max-width:100%;max-height:260px;border-radius:8px;margin-top:6px}
button{padding:7px 14px;margin:6px 6px 0 0;border:none;border-radius:6px;cursor:pointer;font-size:13px}
.pass{background:#22c55e;color:#fff}
.reject{background:#ef4444;color:#fff}
.tip{font-size:13px;color:#6e7d94;margin:10px 0}
.status-0{color:#ef4444}
.status-1{color:#22c55e}
.status-2{color:#64748b}
</style>
</head>
<body>

<!-- 密码锁 -->
<div id="lock">
  <div class="box">
    <h3>🔒 管理员审核后台</h3>
    <p>请输入后台密码后进入</p>
    <input type="password" id="pwd" placeholder="输入密码" onkeydown="if(event.key==='Enter')unlock()">
    <button onclick="unlock()">进入后台</button>
    <div class="err" id="lockErr"></div>
  </div>
</div>

<!-- 后台内容 -->
<div id="app" style="display:none">
  <h2>📋 待审核作品后台</h2>
  <div class="tip" id="statusTip"></div>
  <div id="list"></div>
</div>

<script>
// ============ ① 这里填你的 Supabase 信息（只填这两行） ============
const SUPABASE_URL = "https://bczjjipznfiwsfrtmrzk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_AE4XgynNTlOsxcjLms97VQ_sRSOS2w3";
// =================================================================

// 后台密码：想改密码就改这一行（注意：这是前端简易密码，仅适合内部演示）
const ADMIN_PASSWORD = "admin123";

const { createClient } = supabase;
let supabase = null;

// ---------- 密码锁 ----------
function unlock(){
  const v = document.getElementById("pwd").value.trim();
  const err = document.getElementById("lockErr");
  if(v === ADMIN_PASSWORD){
    sessionStorage.setItem("qs_admin_auth","1");
    enterApp();
  }else{
    err.textContent = "密码不正确，请重试";
  }
}

function enterApp(){
  document.getElementById("lock").style.display = "none";
  document.getElementById("app").style.display = "block";
  initSupabase();
  loadList();
}

// ---------- 初始化数据库连接 ----------
function initSupabase(){
  const tip = document.getElementById("statusTip");
  // 还没替换占位信息时，直接给出提示，避免白屏
  if(!/^https:\/\//.test(SUPABASE_URL) || SUPABASE_ANON_KEY.indexOf("在这里填") !== -1){
    tip.textContent = "⚠️ 请先在代码顶部填写 SUPABASE_URL 和 SUPABASE_ANON_KEY。";
    return;
  }
  try{
    supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }catch(e){
    tip.textContent = "⚠️ 数据库初始化失败：" + e.message;
  }
}

// ---------- 加载作品列表 ----------
async function loadList(){
  const wrap = document.getElementById("list");
  const tip = document.getElementById("statusTip");
  if(!supabase){ tip.textContent = "⚠️ 数据库未连接，请先检查顶部两行配置。"; return; }

  try{
    const {data, error} = await supabase
      .from("works")
      .select("*")
      .order("create_time", {ascending:false});

    if(error){
      tip.textContent = "加载失败：" + error.message;
      wrap.innerHTML = "";
      return;
    }
    if(!data || data.length === 0){
      tip.textContent = "暂无作品记录。";
      wrap.innerHTML = "";
      return;
    }

    tip.textContent = "共 " + data.length + " 条记录";
    let html = "";
    data.forEach(item=>{
      let statusText, cls;
      if(item.status === 1){ statusText = "🟢 已通过"; cls = "status-1"; }
      else if(item.status === 2){ statusText = "⚫ 已驳回"; cls = "status-2"; }
      else { statusText = "🔴 待审核"; cls = "status-0"; }

      html += `<div class="item">
        <h3>${escapeHtml(item.title || "无标题")} <span class="${cls}">${statusText}</span></h3>
        <div class="meta">作者：${escapeHtml(item.author || "-")}｜学号：${escapeHtml(item.student_id || "-")}｜分类：${escapeHtml(item.subject_tag || "-")}</div>
        <p class="desc">${escapeHtml(item.work_desc || "")}</p>
        ${item.work_file ? `<img src="${item.work_file}" alt="作品图片">` : ""}
        <div>
          <button class="pass" onclick="updateStatus('${item.id}',1)">通过</button>
          <button class="reject" onclick="updateStatus('${item.id}',2)">驳回</button>
        </div>
      </div>`;
    });
    wrap.innerHTML = html;
  }catch(e){
    tip.textContent = "加载出错：" + e.message;
  }
}

// ---------- 修改审核状态 ----------
async function updateStatus(id, val){
  if(!supabase) return;
  const {error} = await supabase.from("works").update({status:val}).eq("id", id);
  if(error){ alert("操作失败：" + error.message); return; }
  loadList();
}

// ---------- 简单转义，防止内容破坏页面 ----------
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));
}

// 已通过密码校验的，刷新后直接进入
if(sessionStorage.getItem("qs_admin_auth") === "1"){
  enterApp();
}
</script>
</body>
</html>
